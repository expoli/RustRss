[package]
name = "rustrss-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustrss-core = { path = "../rustrss-core" }
rmcp = { version = "3", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net", "sync"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
# 日志门面：写调用的审计行（target = "mcp"）走与应用同一套 log 实现（core 的 FileLogger）
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json"] }

[dev-dependencies]
# stdio 冒烟测试要拉起真子进程并逐行读写协议通道
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "time", "test-util"] }
# 测试里当 HTTP 客户端用（与 rustrss-core 用的是同一个客户端）
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json"] }
# 测试夹具要造带 published_at 的条目（core 公开模型 `Entry.published` 就是 chrono 类型）；
# 仅测试用，不进产物，也不引入新的依赖树节点（core 已依赖同版本）。
chrono = "0.4"
