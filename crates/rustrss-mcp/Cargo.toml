[package]
name = "rustrss-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustrss-core = { path = "../rustrss-core" }
rmcp = { version = "3", features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
