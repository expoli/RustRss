<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RustRss</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // 内联诊断：内联脚本一解析就执行，用来区分「页面根本没被服务」与「外部 JS 没加载」。
    // 平时留着无妨（一行、不过滤也不报错）。
    const probe = (line) => {
      try {
        window.__TAURI__ && window.__TAURI__.core
          ? window.__TAURI__.core.invoke('ui_log', { line })
          : console.error('probe(no ipc): ' + line);
      } catch (err) {
        console.error('probe 失败', err);
      }
    };
    probe('inline script ran');
    // 外部脚本加载失败与未捕获异常都要上报，否则界面只“什么都不发生”而无任何线索。
    // （这条探针已经拓出过一个真问题：i18n.js 的顶层函数与 app.js 的同名 const 冲突，
    //  WebKit 下那是解析期 SyntaxError，不装这个监听器就只能看到“界面没反应”。）
    window.addEventListener(
      'error',
      (e) => {
        if (e.target && e.target.tagName === 'SCRIPT') {
          probe(`script load error: ${e.target.src}`);
        } else {
          probe(`js error: ${e.message} @ ${e.filename}:${e.lineno}`);
        }
      },
      true
    );
  </script>
</head>

      <p id="startup-refusal-status" class="startup-refusal__status" role="status"></p>
      <div class="startup-refusal__actions">
        <button id="startup-refusal-export" class="primary" data-i18n="startup.refused.export"></button>
        <button id="startup-refusal-quit" data-i18n="startup.refused.quit"></button>
      </div>
    </div>
  </div>

    <input id="search" type="search" data-i18n-placeholder="search.placeholder" autocomplete="off" />
    <div class="grow"></div>
    <button id="btn-refresh" data-i18n="toolbar.refresh" data-i18n-title="toolbar.refreshTitle"></button>
    <button id="btn-add" data-i18n="toolbar.addFeed" data-i18n-title="toolbar.addFeedTitle"></button>

      <button id="btn-win-max" data-i18n-title="win.maximize" aria-label="maximize">□</button>
      <button id="btn-win-close" data-i18n-title="win.close" aria-label="close">✕</button>

  </header>

      <div class="section-title">
        <span data-i18n="sidebar.feeds"></span>
        <span id="feeds-meta" class="dim"></span>
        <button id="btn-new-folder" data-i18n-title="folder.newTitle" aria-label="new folder">＋</button>
      </div>

      <!-- 标签区：颜色圆点 + 名称 + 未读计数，置顶优先（顺序由 core 直出）；
           行可拖拽排序，右键出管理菜单（重命名/颜色/置顶/删除）。 -->
      <div id="tags-head" class="section-title tags-head" role="button" tabindex="0"
        data-i18n-title="sidebar.tagsToggleTitle">
        <span id="tags-arrow" class="section-arrow">▾</span>
        <span data-i18n="sidebar.tags"></span>
        <span id="tags-meta" class="dim"></span>
      </div>
      <ul id="tags" class="tags"></ul>
      <div id="tags-empty" class="tags-empty dim hidden" data-i18n="sidebar.tagsEmpty"></div>
      <div id="add-row" class="add-row hidden">
        <input id="add-url" data-i18n-placeholder="sidebar.addPlaceholder" autocomplete="off" />
        <button id="add-ok" data-i18n="sidebar.add"></button>
      </div>
      <div class="sidebar-foot">
        <span id="db-info" class="dim"></span>
      </div>
    </aside>

    <section class="list">
      <div class="list-head">
        <span id="list-title"></span>
        <span class="list-head-right">
          <span id="list-count" class="dim"></span>
          <!-- 排序与过滤入口：图标按钮弹 ctx-menu（三档 + 分隔 + 隐藏已读）-->
          <button id="btn-list-bulk" data-i18n-title="settings.bulkTitle" aria-label="✓">✓</button>
          <button id="btn-list-sort" data-i18n-title="list.sortTitle" aria-label="sort">⇅</button>
          <!-- 常驻「只看未读」：与排序菜单里的「隐藏已读」同一设置（list.hide_read），
               只是把入口提到显眼处（用户实测找不到菜单里的那项）；快捷键 U -->
          <button id="btn-unread-only" data-i18n="list.unreadOnly" data-i18n-title="list.unreadOnlyTitle" aria-label="unread only" aria-pressed="false"></button>
        </span>
      </div>
      <ul id="entries" class="entries" tabindex="-1"></ul>
    </section>

    <section class="right-col">
      <article id="reader" class="reader">
        <div class="reader-empty">
          <p data-i18n="reader.empty"></p>
          <p id="reader-shortcuts" class="dim"></p>
        </div>
      </article>
      <!-- 状态栏在右下角：原先放工具栏右侧会被长文案挤压刷新/添加/设置按钮。
           常驻固定高度（空时也是一条细线），避免状态出现/消失时阅读区高度跳动。 -->
      <footer class="statusbar" data-tauri-drag-region>
        <span id="status" class="status" role="status"></span>
      </footer>
    </section>
  </main>

            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.logsDir"></b>
                <small data-i18n="settings.openLogsDirHint"></small>
              </div>
            </div>
            <div class="setting-actions">
              <button id="act-open-logs" data-i18n="settings.openLogsDir"></button>
            </div>
          </div></div></section>

      <button id="settings-close" class="settings-close" data-i18n-title="settings.close">✕</button>
    </div>
  </div>

  <div id="ai-confirm-overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="confirm-sheet">
      <h3 data-i18n="ai.confirm.title"></h3>
      <p id="ai-confirm-summary" class="dim small"></p>

      <div class="confirm-section">
        <h4 data-i18n="ai.confirm.target"></h4>
        <code id="ai-confirm-url"></code>
      </div>

      <div class="confirm-section">
        <h4 data-i18n="ai.confirm.headers"></h4>
        <pre id="ai-confirm-headers"></pre>
      </div>

      <div class="confirm-section grow">
        <h4><span data-i18n="ai.confirm.body"></span><span id="ai-confirm-meta" class="dim"></span></h4>
        <pre id="ai-confirm-body"></pre>
      </div>

      <p id="ai-confirm-note" class="dim small"></p>

      <div class="confirm-actions">
        <label class="confirm-skip">
          <input type="checkbox" id="ai-confirm-dont-ask" />
          <span data-i18n="ai.confirm.dontAsk"></span>
        </label>
        <span class="spacer"></span>
        <button id="ai-confirm-cancel" data-i18n="ai.confirm.cancel"></button>
        <button id="ai-confirm-send" class="primary" data-i18n="ai.confirm.send"></button>
      </div>
    </div>
  </div>

  <!-- 通用危险操作确认（取消订阅等）：小尺寸弹窗，Esc/点遮罩/取消均关闭 -->
  <div id="generic-confirm-overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="confirm-sheet small-sheet">
      <h3 id="generic-confirm-title"></h3>
      <p id="generic-confirm-body" class="dim small"></p>
      <div class="confirm-actions">
        <span class="spacer"></span>
        <button id="generic-confirm-cancel"></button>
        <button id="generic-confirm-ok" class="danger"></button>
      </div>
    </div>
  </div>

  <!-- 重置订阅源：标题/文件夹/刷新间隔 + 只读地址。字段先在本地暂存，点「保存」
       才一次落库（取消/Esc/点遮罩都无副作用） -->
  <div id="feed-edit-overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="confirm-sheet edit-sheet">
      <h3 data-i18n="feedEdit.title"></h3>
      <div class="setting-item">
        <div class="text">
          <b data-i18n="feedEdit.name"></b>
          <small data-i18n="feedEdit.nameHint"></small>
        </div>
        <input type="text" id="feed-edit-name" autocomplete="off" maxlength="200" />
      </div>
      <div class="setting-item">
        <div class="text">
          <b data-i18n="feedEdit.folder"></b>
          <small data-i18n="feedEdit.folderHint"></small>
        </div>
        <button type="button" id="feed-edit-folder" class="setting-dropdown" aria-haspopup="menu"></button>
      </div>
      <div class="setting-item">
        <div class="text">
          <b data-i18n="feedEdit.interval"></b>
          <small data-i18n="feedEdit.intervalHint"></small>
        </div>
        <button type="button" id="feed-edit-interval" class="setting-dropdown" aria-haspopup="menu"></button>
      </div>
      <div class="confirm-section">
        <h4 data-i18n="feedEdit.url"></h4>
        <code id="feed-edit-url"></code>
      </div>
      <div class="confirm-actions">
        <span class="spacer"></span>
        <button id="feed-edit-cancel" type="button" data-i18n="feedEdit.cancel"></button>
        <button id="feed-edit-save" type="button" class="primary" data-i18n="feedEdit.save"></button>
      </div>
    </div>
  </div>

  <!-- 标签选择器（阅读器「＋标签」/ 列表行按钮 / t 快捷键共用）：
       输入框常驻焦点，type-ahead 过滤；行顺序 = core 的 list_tags_recent_first
       （最近使用优先）；↑↓ 选择、Enter 附加、Esc 关闭（无副作用）。 -->
  <div id="tag-picker-overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="confirm-sheet tag-sheet">
      <h3 id="tag-picker-title"></h3>
      <input
        type="text"
        id="tag-picker-input"
        maxlength="60"
        autocomplete="off"
        data-i18n-placeholder="tags.pickerPlaceholder"
      />
      <ul id="tag-picker-list" class="tag-picker-list"></ul>
      <p id="tag-picker-semantics" class="dim small" data-i18n="tags.semantics"></p>
      <div class="confirm-actions">
        <span class="spacer"></span>
        <button id="tag-picker-close" type="button" data-i18n="tags.pickerClose"></button>
      </div>
    </div>
  </div>

  <script src="vendor/highlight.min.js"></script>
  <script src="i18n.js"></script>
  <script src="components.js"></script>
  <script src="theme.js"></script>
  <script src="theme-sync.js"></script>
  <script src="theme-settings.js"></script>
  <script src="app.js"></script>
</body>

</html>
