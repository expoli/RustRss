<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RustRss</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // 内联诊断：内联脚本一解析就执行，用来区分「页面根本没被服务」与「外部 JS 没加载」。
    // 平时留着无妨（一行、不过滤也不报错）。
    const probe = (line) => {
      try {
        window.__TAURI__ && window.__TAURI__.core
          ? window.__TAURI__.core.invoke('ui_log', { line })
          : console.error('probe(no ipc): ' + line);
      } catch (err) {
        console.error('probe 失败', err);
      }
    };
    probe('inline script ran');
    // 外部脚本加载失败与未捕获异常都要上报，否则界面只“什么都不发生”而无任何线索。
    // （这条探针已经拓出过一个真问题：i18n.js 的顶层函数与 app.js 的同名 const 冲突，
    //  WebKit 下那是解析期 SyntaxError，不装这个监听器就只能看到“界面没反应”。）
    window.addEventListener(
      'error',
      (e) => {
        if (e.target && e.target.tagName === 'SCRIPT') {
          probe(`script load error: ${e.target.src}`);
        } else {
          probe(`js error: ${e.message} @ ${e.filename}:${e.lineno}`);
        }
      },
      true
    );
  </script>
</head>

<body>
  <!-- 库不兼容（旧开发库/外来文件）时的降级界面：只读导出 OPML + 退出。
       文案走 ui/i18n.js 的双语 key（data-i18n），与其余界面同一套 i18n 机制。 -->
  <div id="startup-refusal" class="startup-refusal" hidden>
    <div class="startup-refusal__card">
      <h2 data-i18n="startup.refused.title"></h2>
      <p data-i18n="startup.refused.body"></p>
      <p class="startup-refusal__meta">
        <span data-i18n="startup.refused.dbPath"></span>
        <code id="startup-refusal-path"></code>
      </p>
      <p class="startup-refusal__hint" data-i18n="startup.refused.exportHint"></p>
      <p id="startup-refusal-status" class="startup-refusal__status" role="status"></p>
      <div class="startup-refusal__actions">
        <button id="startup-refusal-export" class="primary" data-i18n="startup.refused.export"></button>
        <button id="startup-refusal-quit" data-i18n="startup.refused.quit"></button>
      </div>
    </div>
  </div>
  <header class="toolbar" data-tauri-drag-region>
    <span class="brand" data-tauri-drag-region data-i18n="app.name">RustRss</span>
    <button id="btn-search-toggle" type="button" class="ui-button ui-button--icon" data-icon="search" data-i18n-aria-label="m.searchOpen" data-i18n-title="m.searchOpen"></button>
    <input id="search" type="search" data-i18n-placeholder="search.placeholder" aria-describedby="search-scope" autocomplete="off" />
    <button id="btn-search-cancel" type="button" class="ui-button ui-button--text" data-i18n="m.searchCancel"></button>
    <div class="grow"></div>
    <button id="btn-refresh" class="ui-button" data-icon="refresh" data-i18n="toolbar.refresh" data-i18n-title="toolbar.refreshTitle"></button>
    <button id="btn-add" class="ui-button" data-icon="plus" data-i18n="toolbar.addFeed" data-i18n-title="toolbar.addFeedTitle"></button>
    <button id="btn-settings" class="ui-button ui-button--secondary" data-icon="settings" data-i18n="toolbar.settings" data-i18n-title="toolbar.settingsTitle"></button>
    <div class="win-controls" data-desktop-only>
      <button id="btn-win-min" data-icon="minimize" data-i18n-title="win.minimize" data-i18n-aria-label="win.minimize"></button>
      <button id="btn-win-max" data-icon="maximize" data-i18n-title="win.maximize" data-i18n-aria-label="win.maximize"></button>
      <button id="btn-win-close" data-icon="close" data-i18n-title="win.close" data-i18n-aria-label="win.close"></button>
    </div>
  </header>

  <main>
    <aside class="sidebar">
      <nav id="views" class="views"></nav>
      <div class="section-title">
        <span id="feeds-heading" role="heading" aria-level="2" tabindex="-1" data-i18n="sidebar.feeds"></span>
        <span id="feeds-meta" class="dim"></span>
        <button id="btn-new-folder" data-icon="plus" data-i18n-title="folder.newTitle" data-i18n-aria-label="folder.newTitle"></button>
      </div>
      <ul id="feeds" class="feeds"></ul>
      <p id="m-feeds-empty" class="m-only hidden dim" data-i18n="m.feedsEmpty"></p>
      <!-- 标签区：颜色圆点 + 名称 + 未读计数，置顶优先（顺序由 core 直出）；
           行可拖拽排序，右键出管理菜单（重命名/颜色/置顶/删除）。 -->
      <div id="tags-head" class="section-title tags-head" role="button" tabindex="0"
        data-i18n-title="sidebar.tagsToggleTitle">
        <span id="tags-arrow" class="section-arrow">▾</span>
        <span data-i18n="sidebar.tags"></span>
        <span id="tags-meta" class="dim"></span>
      </div>
      <ul id="tags" class="tags"></ul>
      <div id="tags-empty" class="tags-empty dim hidden" data-i18n="sidebar.tagsEmpty"></div>
      <div id="add-row" class="add-row hidden">
        <label class="m-only" for="add-url" data-i18n="m.feedUrl"></label>
        <input id="add-url" type="url" inputmode="url" enterkeyhint="go" data-i18n-placeholder="sidebar.addPlaceholder" autocomplete="off" autocapitalize="none" spellcheck="false" />
        <button id="add-ok" class="ui-button ui-button--primary" data-i18n="sidebar.add"></button>
        <button id="add-rsshub" type="button" class="ui-button ui-button--text" data-i18n="feedDiscover.rsshub"></button>
      </div>
      <div class="sidebar-foot">
        <span id="db-info" class="dim"></span>
      </div>
    </aside>

    <section class="list">
      <div class="list-head">
        <!-- 窄屏（手机/平板）页面式导航的分段切换：与侧栏 #views 行同一套 setView，
             只是入口搬到列表页头。桌面宽度由 CSS 隐藏。 -->
        <div id="m-seg-articles" class="m-seg" role="tablist" aria-label="Articles view">
          <button type="button" data-mview="unread" data-i18n="list.unread"></button>
          <button type="button" data-mview="all" data-i18n="list.all"></button>
        </div>
        <div id="m-seg-saved" class="m-seg" role="tablist" aria-label="Saved view">
          <button type="button" data-mview="starred" data-i18n="list.starred"></button>
          <button type="button" data-mview="later" data-i18n="list.later"></button>
        </div>
        <span id="search-scope" data-i18n="m.searchScope"></span>
        <span id="list-title" role="heading" aria-level="2" tabindex="-1"></span>
        <span class="list-head-right">
          <span id="list-count" class="dim"></span>
          <!-- 排序与过滤入口：图标按钮弹 ctx-menu（三档 + 分隔 + 隐藏已读）-->
          <button id="btn-list-bulk" data-icon="check" data-i18n-title="settings.bulkTitle" data-i18n-aria-label="settings.bulkTitle"></button>
          <button id="btn-list-sort" class="ui-button ui-button--icon" data-icon="sort" data-i18n-title="list.sortTitle" data-i18n-aria-label="list.sortTitle"></button>
          <!-- 常驻「只看未读」：与排序菜单里的「隐藏已读」同一设置（list.hide_read），
               只是把入口提到显眼处（用户实测找不到菜单里的那项）；快捷键 U -->
          <button id="btn-unread-only" data-i18n="list.unreadOnly" data-i18n-title="list.unreadOnlyTitle" data-i18n-aria-label="list.unreadOnly" aria-pressed="false"></button>
        </span>
      </div>
      <ul id="entries" class="entries" tabindex="-1"></ul>
    </section>

    <section class="right-col">
      <!-- 窄屏全屏阅读器的返回键：只在手机宽度且阅读页激活时显示；
           点击走 history.back()（与 Android 系统返回同一机制），由 mobile.js 恢复原页面。 -->
      <button id="m-reader-back" type="button" class="ui-button" data-icon="back" data-i18n="m.back" data-i18n-title="m.back"></button>
      <article id="reader" class="reader">
        <div class="reader-empty">
          <p data-i18n="reader.empty"></p>
          <p id="reader-shortcuts" class="dim"></p>
        </div>
      </article>
      <!-- 状态栏在右下角：原先放工具栏右侧会被长文案挤压刷新/添加/设置按钮。
           常驻固定高度（空时也是一条细线），避免状态出现/消失时阅读区高度跳动。 -->
      <footer class="statusbar" data-tauri-drag-region>
        <span id="status" class="status" role="status"></span>
      </footer>
    </section>
  </main>

  <!-- 窄屏（手机/平板）页面式导航的底部主导航：四个一级目的地（文章/订阅/收藏/设置）。
       桌面宽度整条隐藏；阅读页为沉浸式全屏，也隐藏（返回走 m-reader-back / 系统返回）。 -->
  <nav id="m-nav" aria-label="Primary">
    <button type="button" class="m-nav-btn" data-mpage-btn="articles">
      <span class="m-ico" aria-hidden="true" data-icon="articles"></span><span class="m-label" data-i18n="m.nav.articles"></span>
    </button>
    <button type="button" class="m-nav-btn" data-mpage-btn="subscriptions">
      <span class="m-ico" aria-hidden="true" data-icon="subscriptions"></span><span class="m-label" data-i18n="m.nav.subscriptions"></span>
    </button>
    <button type="button" class="m-nav-btn" data-mpage-btn="saved">
      <span class="m-ico" aria-hidden="true" data-icon="star"></span><span class="m-label" data-i18n="m.nav.saved"></span>
    </button>
    <button type="button" class="m-nav-btn" data-mpage-btn="settings">
      <span class="m-ico" aria-hidden="true" data-icon="settings"></span><span class="m-label" data-i18n="m.nav.settings"></span>
    </button>
  </nav>

  <!-- 窄屏状态镜像：状态栏在桌面位于右栏底部，窄屏下列表页看不到它，
       这里用一条固定镜像把 #status 文本带到可见处（mobile.js 同步）。 -->
  <div id="m-status" class="m-status" role="status"><span id="m-status-text"></span></div>

  <dialog id="aa-dialog" aria-labelledby="aa-title"><div class="aa-heading"><h3 id="aa-title" data-i18n="theme.reading"></h3><button id="aa-close" data-i18n="settings.close"></button></div><div id="aa-editor"></div></dialog>
  <dialog id="keyboard-help" aria-labelledby="keyboard-help-title">
    <div class="aa-heading"><h3 id="keyboard-help-title" data-i18n="keyboard.title"></h3><button id="keyboard-help-close" data-i18n="settings.close" autofocus></button></div>
    <p data-i18n="reader.shortcuts"></p>
    <p data-i18n="keyboard.extra"></p>
    <p data-i18n="keyboard.navigation"></p>
  </dialog>
  <div id="settings-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="m-settings-title">
    <div class="settings-dialog">
      <header class="m-settings-header m-only">
        <button id="m-settings-back" type="button" data-i18n="m.settingsBack"></button>
        <h2 id="m-settings-title" tabindex="-1" data-i18n="settings.title"></h2>
      </header>
      <nav class="settings-nav">
        <div class="settings-nav-title" data-i18n="settings.title"></div>
        <ul id="settings-nav-list" role="tablist" aria-orientation="vertical"><li role="presentation"><button type="button" role="tab" id="tab-appearance" data-pane="appearance" data-icon="appearance" aria-controls="pane-appearance" aria-selected="false" tabindex="-1" data-i18n="settings.nav.appearance"></button></li><li role="presentation"><button type="button" role="tab" id="tab-reading" data-pane="reading" data-icon="reading" aria-controls="pane-reading" aria-selected="false" tabindex="-1" data-i18n="settings.nav.reading"></button></li><li role="presentation"><button type="button" role="tab" id="tab-subscriptions" data-pane="subscriptions" data-icon="subscriptions" aria-controls="pane-subscriptions" aria-selected="false" tabindex="-1" data-i18n="settings.nav.subscriptions"></button></li><li role="presentation"><button type="button" role="tab" id="tab-ai" data-pane="ai" data-icon="ai" aria-controls="pane-ai" aria-selected="false" tabindex="-1" data-i18n="settings.nav.ai"></button></li><li role="presentation" data-desktop-only><button type="button" role="tab" id="tab-mcp" data-pane="mcp" data-icon="link" aria-controls="pane-mcp" aria-selected="false" tabindex="-1" data-i18n="settings.nav.mcp"></button></li><li role="presentation"><button type="button" role="tab" id="tab-data" data-pane="data" data-icon="data" aria-controls="pane-data" aria-selected="false" tabindex="-1" data-i18n="settings.nav.data"></button></li><li role="presentation"><button type="button" role="tab" id="tab-general" data-pane="general" data-icon="settings" aria-controls="pane-general" aria-selected="false" tabindex="-1" data-i18n="settings.nav.general"></button></li></ul>
        <div class="settings-nav-foot">
          <span id="settings-db-path" class="dim" title=""></span>
        </div>
      </nav>

      <section class="settings-body"><div class="pane hidden" id="pane-appearance" role="tabpanel" aria-labelledby="tab-appearance" data-pane="appearance"><h3 data-i18n="settings.nav.appearance"></h3><div id="appearance-editor"></div></div>
<div class="pane hidden" id="pane-reading" role="tabpanel" aria-labelledby="tab-reading" data-pane="reading"><h3 data-i18n="settings.nav.reading"></h3><div id="reading-editor"></div><div class="setting-block" data-desktop-only>
            <h4 data-i18n="settings.section.readBehaviour"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.markRead.title"></b>
                <small data-i18n="settings.markRead.hint"></small>
              </div>
              <label class="switch"><input type="checkbox" id="set-mark-read" /><span></span></label>
            </div>
          </div></div>
<div class="pane hidden" id="pane-subscriptions" role="tabpanel" aria-labelledby="tab-subscriptions" data-pane="subscriptions"><h3 data-i18n="settings.nav.subscriptions"></h3><div class="setting-block">
            <h4 data-i18n="settings.proxy.title"></h4>
            <p data-i18n="settings.proxy.hint"></p>
            <div class="setting-item"><label for="set-proxy-mode" data-i18n="settings.proxy.mode"></label>
              <select id="set-proxy-mode"><option value="environment" data-i18n="settings.proxy.environment"></option><option value="direct" data-i18n="settings.proxy.direct"></option><option value="custom" data-i18n="settings.proxy.custom"></option></select></div>
            <div class="setting-item"><label for="set-proxy-url" data-i18n="settings.proxy.url"></label><input id="set-proxy-url" type="url" placeholder="http://127.0.0.1:8080" autocomplete="off" /></div>
            <div class="setting-item"><label for="set-proxy-bypass" data-i18n="settings.proxy.bypass"></label><input id="set-proxy-bypass" type="text" placeholder="localhost,127.0.0.1" autocomplete="off" /></div>
            <button type="button" id="set-proxy-save" data-i18n="settings.proxy.save"></button>
            <p id="set-proxy-status" role="status" aria-live="polite"></p>
            <h4 data-i18n="settings.section.refresh"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.refreshInterval"></b>
                <small data-i18n="settings.refreshIntervalHint"></small>
              </div>
              <button type="button" id="set-refresh-interval" class="setting-dropdown" aria-haspopup="menu"></button>
            </div>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.refreshConcurrency"></b>
                <small data-i18n="settings.refreshConcurrencyHint"></small>
              </div>
              <button type="button" id="set-refresh-concurrency" class="setting-dropdown" aria-haspopup="menu"></button>
            </div>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.refreshOnStart"></b>
                <small data-i18n="settings.refreshOnStartHint"></small>
              </div>
              <label class="switch"><input type="checkbox" id="set-refresh-on-start" /><span></span></label>
            </div>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.notifyNewArticles"></b>
                <small data-i18n="settings.notifyNewArticlesHint"></small>
              </div>
              <label class="switch"><input type="checkbox" id="set-notify-new-articles" /><span></span></label>
            </div>
          </div><div class="setting-block">
            <h4 data-i18n="settings.section.rsshubInstance"></h4>
            <div class="setting-item">
              <label class="text" for="set-rsshub-mirror">
                <b data-i18n="settings.rsshub.mirror"></b>
                <small data-i18n="settings.rsshub.mirrorHint"></small>
              </label>
              <input id="set-rsshub-mirror" autocomplete="off" />
            </div>
            <div class="setting-actions">
              <button id="btn-rsshub-save" data-i18n="settings.rsshub.save"></button>
              <button id="btn-rsshub-test" data-i18n="settings.rsshub.test"></button>
            </div>
            <p id="rsshub-status" class="dim small">—</p>
          </div><div class="setting-block">
            <h4 data-i18n="settings.section.migration"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.rsshub.migrate"></b>
                <small data-i18n="settings.rsshub.migrateHint"></small>
              </div>
              <button id="btn-rsshub-migrate" data-i18n="settings.rsshub.migrate"></button>
            </div>
          </div></div>
<div class="pane hidden" id="pane-ai" role="tabpanel" aria-labelledby="tab-ai" data-pane="ai"><h3 data-i18n="settings.nav.ai"></h3><div class="setting-block">
            <h4 data-i18n="settings.section.provider"></h4>

            <div class="setting-item">
              <label class="text" for="ai-provider">
                <b data-i18n="settings.ai.provider"></b>
              </label>
              <select id="ai-provider">
                <option value="ollama" data-i18n="settings.ai.providerOllama"></option>
                <option value="openai" data-i18n="settings.ai.providerOpenai"></option>
                <option value="anthropic" data-i18n="settings.ai.providerAnthropic"></option>
                <option value="gemini" data-i18n="settings.ai.providerGemini"></option>
              </select>
            </div>

            <div class="setting-item">
              <label class="text" for="ai-model">
                <b data-i18n="settings.ai.model"></b>
                <small data-i18n="settings.ai.modelPlaceholder"></small>
              </label>
              <input id="ai-model" autocomplete="off" />
            </div>

            <div class="setting-item">
              <label class="text" for="ai-base-url">
                <b data-i18n="settings.ai.baseUrl"></b>
                <small data-i18n="settings.ai.baseUrlPlaceholder"></small>
              </label>
              <input id="ai-base-url" autocomplete="off" />
            </div>

            <!-- Android 专属指引：默认 127.0.0.1 指手机自身，Ollama 必须用设备
                 可达的地址（评审 B2）。桌面不显示；mobile.js 按 UA 置 body 标记。 -->
            <p id="ai-endpoint-android-hint" class="dim small android-hint" hidden
              data-i18n="settings.ai.endpointAndroidHint"></p>

            <details class="m-setting-advanced" open>
              <summary data-i18n="m.advancedAi"></summary>
            <div class="setting-item">
              <label class="text" for="ai-target">
                <b data-i18n="settings.ai.target"></b>
              </label>
              <input id="ai-target" autocomplete="off" />
            </div>
            <div class="setting-item">
              <label class="text" for="ai-max-tokens">
                <b data-i18n="settings.ai.maxTokens"></b>
                <small data-i18n="settings.ai.maxTokensHint"></small>
              </label>
              <input id="ai-max-tokens" type="number" min="256" max="32768" step="256" autocomplete="off" />
            </div>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.ai.reasoning"></b>
                <small data-i18n="settings.ai.reasoningHint"></small>
              </div>
              <button type="button" id="set-ai-reasoning" class="setting-dropdown" aria-haspopup="menu"></button>
            </div>
            </details>
          </div><div class="setting-block">
            <h4 data-i18n="settings.section.credentials"></h4>
            <div class="setting-item">
              <label class="text" for="ai-key">
                <b data-i18n="settings.ai.key"></b>
                <small id="ai-key-hint" data-i18n="settings.ai.keyPlaceholder"></small>
              </label>
              <input id="ai-key" type="password" autocomplete="off" />
            </div>
            <div class="setting-actions">
              <button id="ai-save" data-i18n="settings.ai.save"></button>
              <button id="ai-clear-key" data-i18n="settings.ai.clearKey"></button>
              <button id="ai-test" data-i18n="settings.ai.test"></button>
            </div>
            <p id="ai-status" class="dim small">—</p>
          </div><div class="setting-block">
            <h4 data-i18n="settings.section.sending"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.ai.confirmBeforeSend"></b>
                <small data-i18n="settings.ai.confirmBeforeSendHint"></small>
              </div>
              <label class="switch"><input type="checkbox" id="set-ai-confirm" /><span></span></label>
            </div>
          </div></div>
<div class="pane hidden" id="pane-mcp" role="tabpanel" aria-labelledby="tab-mcp" data-pane="mcp"><h3 data-i18n="settings.nav.mcp"></h3><div class="setting-block">
            <h4 data-i18n="settings.section.server"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.mcp.enabled"></b>
                <small data-i18n="settings.mcp.hint"></small>
              </div>
              <label class="switch"><input type="checkbox" id="set-mcp-enabled" /><span></span></label>
            </div>

            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.mcp.port"></b>
                <small data-i18n="settings.mcp.portHint"></small>
              </div>
              <input id="mcp-port" type="number" min="1024" max="65535" />

            <p id="mcp-status" class="dim small">—</p>
          </div><div class="setting-block">
            <h4 data-i18n="settings.section.client"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.mcp.snippetTitle"></b>
                <small data-i18n="settings.mcp.snippetHint"></small>
                <small data-i18n="settings.mcp.previewHint"></small>
              </div>
            </div>
            <div class="setting-actions">
              <button id="mcp-copy-snippet" data-i18n="settings.mcp.copySnippet"></button>
              <button id="mcp-rotate" data-i18n="settings.mcp.rotate"></button>
            </div>
            <textarea id="mcp-snippet" rows="8" readonly></textarea>
          </div><div class="setting-block">
            <h4 data-i18n="settings.section.write"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.mcp.writeEnabled"></b>
                <small data-i18n="settings.mcp.writeEnabledHint"></small>
              </div>
              <label class="switch"
                ><input type="checkbox" id="set-mcp-write-enabled" /><span></span></label
              >
            </div>

            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.mcp.dangerousEnabled"></b>
                <small data-i18n="settings.mcp.dangerousEnabledHint"></small>
              </div>
              <label class="switch"
                ><input type="checkbox" id="set-mcp-dangerous-enabled" /><span></span></label
              >
            </div>

            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.mcp.writeToken"></b>
                <small data-i18n="settings.mcp.writeTokenHint"></small>
              </div>
            </div>
            <p id="mcp-write-token" class="dim small">—</p>
            <div class="setting-actions">
              <button id="mcp-write-generate" data-i18n="settings.mcp.writeGenerate"></button>
              <button id="mcp-write-copy" data-i18n="settings.mcp.writeCopy"></button>
              <button id="mcp-write-rotate" data-i18n="settings.mcp.writeRotate"></button>
              <button id="mcp-write-clear" data-i18n="settings.mcp.writeClear"></button>
            </div>
          </div></div>
<div class="pane hidden" id="pane-data" role="tabpanel" aria-labelledby="tab-data" data-pane="data"><h3 data-i18n="settings.nav.data"></h3><div class="setting-block">
            <h4 data-i18n="settings.section.storage"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.dbPath"></b>
                <small id="general-db-path"></small>
              </div>
            </div>
            <div class="setting-item" data-desktop-only>
              <div class="text">
                <b data-i18n="settings.storageHintTitle"></b>
                <small data-i18n="settings.storageHint"></small>
              </div>
            </div>
            <p class="m-only dim" data-i18n="m.opmlBackupHint"></p>
          </div><div class="setting-block">
            <h4 data-i18n="settings.section.opml"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.opmlTitle"></b>
                <small data-i18n="settings.opmlHint"></small>
              </div>
            </div>
            <div class="setting-actions">
              <button id="act-import-opml" data-i18n="settings.importOpml"></button>
              <button id="act-export-opml" data-i18n="settings.exportOpml"></button>
            </div>
          </div><div class="setting-block" data-desktop-only>
            <h4 data-i18n="settings.section.backup"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.backupTitle"></b>
                <small data-i18n="settings.backupHint"></small>
              </div>
            </div>
            <div class="setting-actions">
              <button id="act-backup-db" data-i18n="settings.backupDb"></button>
              <button id="act-restore-db" data-i18n="settings.restoreDb"></button>
            </div>
          </div></div>
<div class="pane hidden" id="pane-general" role="tabpanel" aria-labelledby="tab-general" data-pane="general"><h3 data-i18n="settings.nav.general"></h3><div class="setting-block"><div class="setting-item">
              <div class="text">
                <b data-i18n="settings.language"></b>
                <small data-i18n="settings.languageHint"></small>
              </div>
              <button type="button" id="set-language" class="setting-dropdown" aria-haspopup="menu"></button>
            </div><div class="setting-item" data-desktop-only>
              <div class="text">
                <b data-i18n="settings.closeAction"></b>
                <small data-i18n="settings.closeActionHint"></small>
              </div>
              <button type="button" id="set-close-action" class="setting-dropdown" aria-haspopup="menu"></button>
            </div></div><div class="setting-block">
            <div class="setting-item">
              <div class="text">
                <b>RustRss</b>
                <small data-i18n="settings.about.tagline"></small>
              </div>
            </div>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.about.license"></b>
                <small>AGPL-3.0-or-later</small>
              </div>
            </div>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.about.privacy"></b>
                <small data-i18n="settings.about.privacyHint"></small>
              </div>
            </div>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.about.source"></b>
                <small data-i18n="settings.about.sourceHint"></small>
              </div>
            </div>
            <div class="setting-actions">
              <button id="about-open-source" data-i18n="settings.about.openSource"></button>
            </div>
          </div><div class="setting-block">
            <h4 data-i18n="settings.section.logging"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.logLevel"></b>
                <small data-i18n="settings.logLevelHint"></small>
              </div>
              <button type="button" id="set-log-level" class="setting-dropdown" aria-haspopup="menu"></button>
            </div>
            <div class="setting-item" data-desktop-only>
              <div class="text">
                <b data-i18n="settings.logsDir"></b>
                <small data-i18n="settings.openLogsDirHint"></small>
              </div>
            </div>
            <div class="setting-actions" data-desktop-only>
              <button id="act-open-logs" data-i18n="settings.openLogsDir"></button>
            </div>
          </div></div></section>

      <button id="settings-close" class="settings-close" data-i18n-title="settings.close">✕</button>
    </div>
  </div>

  <div id="ai-confirm-overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="confirm-sheet">
      <h3 data-i18n="ai.confirm.title"></h3>
      <p id="ai-confirm-summary" class="dim small"></p>

      <div class="confirm-section">
        <h4 data-i18n="ai.confirm.target"></h4>
        <code id="ai-confirm-url"></code>
      </div>

      <div class="confirm-section">
        <h4 data-i18n="ai.confirm.headers"></h4>
        <pre id="ai-confirm-headers"></pre>
      </div>

      <div class="confirm-section grow">
        <h4><span data-i18n="ai.confirm.body"></span><span id="ai-confirm-meta" class="dim"></span></h4>
        <pre id="ai-confirm-body"></pre>
      </div>

      <p id="ai-confirm-note" class="dim small"></p>

      <div class="confirm-actions">
        <label class="confirm-skip">
          <input type="checkbox" id="ai-confirm-dont-ask" />
          <span data-i18n="ai.confirm.dontAsk"></span>
        </label>
        <span class="spacer"></span>
        <button id="ai-confirm-cancel" data-i18n="ai.confirm.cancel"></button>
        <button id="ai-confirm-send" class="primary" data-i18n="ai.confirm.send"></button>
      </div>
    </div>
  </div>

  <!-- 通用危险操作确认（取消订阅等）：小尺寸弹窗，Esc/点遮罩/取消均关闭 -->
  <div id="generic-confirm-overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="confirm-sheet small-sheet">
      <h3 id="generic-confirm-title"></h3>
      <p id="generic-confirm-body" class="dim small"></p>
      <div class="confirm-actions">
        <span class="spacer"></span>
        <button id="generic-confirm-cancel"></button>
        <button id="generic-confirm-ok" class="danger"></button>
      </div>
    </div>
  </div>

  <!-- 重置订阅源：标题/文件夹/刷新间隔 + 只读地址。字段先在本地暂存，点「保存」
       才一次落库（取消/Esc/点遮罩都无副作用） -->
  <div id="feed-edit-overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="confirm-sheet edit-sheet">
      <h3 data-i18n="feedEdit.title"></h3>
      <div class="setting-item">
        <div class="text">
          <b data-i18n="feedEdit.name"></b>
          <small data-i18n="feedEdit.nameHint"></small>
        </div>
        <input type="text" id="feed-edit-name" autocomplete="off" maxlength="200" />
      </div>
      <div class="setting-item">
        <div class="text">
          <b data-i18n="feedEdit.folder"></b>
          <small data-i18n="feedEdit.folderHint"></small>
        </div>
        <button type="button" id="feed-edit-folder" class="setting-dropdown" aria-haspopup="menu"></button>
      </div>
      <div class="setting-item">
        <div class="text">
          <b data-i18n="feedEdit.interval"></b>
          <small data-i18n="feedEdit.intervalHint"></small>
        </div>
        <button type="button" id="feed-edit-interval" class="setting-dropdown" aria-haspopup="menu"></button>
      </div>
      <div class="confirm-section">
        <h4 data-i18n="feedEdit.url"></h4>
        <code id="feed-edit-url"></code>
      </div>
      <div class="confirm-actions">
        <span class="spacer"></span>
        <button id="feed-edit-cancel" type="button" data-i18n="feedEdit.cancel"></button>
        <button id="feed-edit-save" type="button" class="primary" data-i18n="feedEdit.save"></button>
      </div>
    </div>
  </div>

  <!-- 标签选择器（阅读器「＋标签」/ 列表行按钮 / t 快捷键共用）：
       输入框常驻焦点，type-ahead 过滤；行顺序 = core 的 list_tags_recent_first
       （最近使用优先）；↑↓ 选择、Enter 附加、Esc 关闭（无副作用）。 -->
  <div id="tag-picker-overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="confirm-sheet tag-sheet">
      <h3 id="tag-picker-title"></h3>
      <input
        type="text"
        id="tag-picker-input"
        maxlength="60"
        autocomplete="off"
        data-i18n-placeholder="tags.pickerPlaceholder"
      />
      <ul id="tag-picker-list" class="tag-picker-list"></ul>
      <p id="tag-picker-semantics" class="dim small" data-i18n="tags.semantics"></p>
      <div class="confirm-actions">
        <span class="spacer"></span>
        <button id="tag-picker-close" type="button" data-i18n="tags.pickerClose"></button>
      </div>
    </div>
  </div>

  <script src="vendor/highlight.min.js"></script>
  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="components.js"></script>
  <script src="theme.js"></script>
  <script src="theme-sync.js"></script>
  <script src="theme-settings.js"></script>
  <script src="app.js"></script>
  <script src="mobile.js"></script>
</body>

</html>
