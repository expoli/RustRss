<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RustRss</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="toolbar">
    <span class="brand">RustRss</span>
    <input id="search" type="search" placeholder="搜索标题与正文（按 / 聚焦）" autocomplete="off" />
    <div class="grow"></div>
    <button id="btn-refresh" title="刷新全部订阅（r）">刷新全部</button>
    <button id="btn-add" title="添加订阅">添加订阅</button>
    <button id="btn-settings" title="设置">设置</button>
    <span id="status" class="status" role="status"></span>
  </header>

  <main>
    <aside class="sidebar">
      <nav id="views" class="views"></nav>
      <div class="section-title">
        <span>订阅源</span>
        <span id="feeds-meta" class="dim"></span>
      </div>
      <ul id="feeds" class="feeds"></ul>
      <div id="add-row" class="add-row hidden">
        <input id="add-url" placeholder="https://example.com/feed.xml" autocomplete="off" />
        <button id="add-ok">添加</button>
      </div>
      <div class="sidebar-foot">
        <span id="db-info" class="dim" title="数据库位置"></span>
      </div>
    </aside>

    <section class="list">
      <div class="list-head">
        <span id="list-title">全部未读</span>
        <span id="list-count" class="dim"></span>
      </div>
      <ul id="entries" class="entries"></ul>
    </section>

    <article id="reader" class="reader">
      <div class="reader-empty">
        <p>从中间列表选一篇文章。</p>
        <p class="dim">
          快捷键：<b>j</b>/<b>k</b> 上下 · <b>Enter</b> 打开 · <b>u</b> 未读切换 · <b>s</b> 星标 ·
          <b>r</b> 刷新 · <b>/</b> 搜索 · <b>Esc</b> 清除搜索
        </p>
      </div>
    </article>
  </main>

  <div id="settings-overlay" class="overlay hidden">
    <div class="dialog">
      <div class="dialog-head">
        <span>设置</span>
        <button id="settings-close">关闭</button>
      </div>

      <label class="setting-row">
        <input type="checkbox" id="set-mark-read" />
        <span>
          <b>j / k 浏览时顺便标记已读</b>
          <small>
            关闭后：j/k 只移动选中项并把文章显示在右栏，只有 <b>Enter</b>、鼠标点击或 <b>u</b>
            才会改变已读状态。默认开启（键盘阅读器的主流做法：扫一遍即已读）。
          </small>
        </span>
      </label>

      <div class="setting-actions">
        <button id="act-mark-all-read">当前视图全部已读</button>
        <button id="act-mark-all-unread">当前视图全部未读（撤销）</button>
      </div>

      <p class="dim small">设置存在同一个数据库里，与订阅、已读状态一起备份。</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
