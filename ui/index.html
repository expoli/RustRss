<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RustRss</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // 内联诊断：内联脚本一解析就执行，用来区分「页面根本没被服务」与「外部 JS 没加载」。
    // 平时留着无妨（一行、不过滤也不报错）。
    const probe = (line) => {
      try {
        window.__TAURI__ && window.__TAURI__.core
          ? window.__TAURI__.core.invoke('ui_log', { line })
          : console.error('probe(no ipc): ' + line);
      } catch (err) {
        console.error('probe 失败', err);
      }
    };
    probe('inline script ran');
    // 外部脚本加载失败与未捕获异常都要上报，否则界面只“什么都不发生”而无任何线索。
    // （这条探针已经拓出过一个真问题：i18n.js 的顶层函数与 app.js 的同名 const 冲突，
    //  WebKit 下那是解析期 SyntaxError，不装这个监听器就只能看到“界面没反应”。）
    window.addEventListener(
      'error',
      (e) => {
        if (e.target && e.target.tagName === 'SCRIPT') {
          probe(`script load error: ${e.target.src}`);
        } else {
          probe(`js error: ${e.message} @ ${e.filename}:${e.lineno}`);
        }
      },
      true
    );
  </script>
</head>

<body>
  <header class="toolbar" data-tauri-drag-region>
    <span class="brand" data-tauri-drag-region data-i18n="app.name">RustRss</span>
    <input id="search" type="search" data-i18n-placeholder="search.placeholder" autocomplete="off" />
    <div class="grow"></div>
    <button id="btn-refresh" data-i18n="toolbar.refresh" data-i18n-title="toolbar.refreshTitle"></button>
    <button id="btn-add" data-i18n="toolbar.addFeed" data-i18n-title="toolbar.addFeedTitle"></button>
    <button id="btn-settings" data-i18n="toolbar.settings" data-i18n-title="toolbar.settingsTitle"></button>
    <div class="win-controls">
      <button id="btn-win-min" data-i18n-title="win.minimize" aria-label="minimize">─</button>
      <button id="btn-win-max" data-i18n-title="win.maximize" aria-label="maximize">□</button>
      <button id="btn-win-close" data-i18n-title="win.close" aria-label="close">✕</button>
    </div>
  </header>

  <main>
    <aside class="sidebar">
      <nav id="views" class="views"></nav>
      <div class="section-title">
        <span data-i18n="sidebar.feeds"></span>
        <span id="feeds-meta" class="dim"></span>
        <button id="btn-new-folder" data-i18n-title="folder.newTitle" aria-label="new folder">＋</button>
      </div>
      <ul id="feeds" class="feeds"></ul>
      <div id="add-row" class="add-row hidden">
        <input id="add-url" data-i18n-placeholder="sidebar.addPlaceholder" autocomplete="off" />
        <button id="add-ok" data-i18n="sidebar.add"></button>
      </div>
      <div class="sidebar-foot">
        <span id="db-info" class="dim"></span>
      </div>
    </aside>

    <section class="list">
      <div class="list-head">
        <span id="list-title"></span>
        <span id="list-count" class="dim"></span>
      </div>
      <ul id="entries" class="entries"></ul>
    </section>

    <section class="right-col">
      <article id="reader" class="reader">
        <div class="reader-empty">
          <p data-i18n="reader.empty"></p>
          <p id="reader-shortcuts" class="dim"></p>
        </div>
      </article>
      <!-- 状态栏在右下角：原先放工具栏右侧会被长文案挤压刷新/添加/设置按钮。
           常驻固定高度（空时也是一条细线），避免状态出现/消失时阅读区高度跳动。 -->
      <footer class="statusbar" data-tauri-drag-region>
        <span id="status" class="status" role="status"></span>
      </footer>
    </section>
  </main>

  <div id="settings-overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="settings-dialog">
      <nav class="settings-nav">
        <div class="settings-nav-title" data-i18n="settings.title"></div>
        <ul id="settings-nav-list">
          <li data-pane="general" class="active">
            <span class="icon">⚙</span><span data-i18n="settings.nav.general"></span>
          </li>
          <li data-pane="reading">
            <span class="icon">👁</span><span data-i18n="settings.nav.reading"></span>
          </li>
          <li data-pane="data">
            <span class="icon">⇅</span><span data-i18n="settings.nav.data"></span>
          </li>
          <li data-pane="ai">
            <span class="icon">✨</span><span data-i18n="settings.nav.ai"></span>
          </li>
          <li data-pane="mcp">
            <span class="icon">🔌</span><span data-i18n="settings.nav.mcp"></span>
          </li>
          <li data-pane="rsshub">
            <span class="icon">🛰</span><span data-i18n="settings.nav.rsshub"></span>
          </li>
          <li data-pane="about">
            <span class="icon">ℹ</span><span data-i18n="settings.nav.about"></span>
          </li>
        </ul>
        <div class="settings-nav-foot">
          <span id="settings-db-path" class="dim" title=""></span>
        </div>
      </nav>

      <section class="settings-body">
        <!-- 通用 -->
        <div class="pane" data-pane="general">
          <h3 data-i18n="settings.nav.general"></h3>

          <div class="setting-block">
            <h4 data-i18n="settings.section.appearance"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.language"></b>
                <small data-i18n="settings.languageHint"></small>
              </div>
              <select id="set-language">
                <option value="auto" data-i18n="settings.languageAuto"></option>
                <option value="zh-CN" data-i18n="settings.languageZh"></option>
                <option value="en" data-i18n="settings.languageEn"></option>
              </select>
            </div>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.theme"></b>
                <small data-i18n="settings.themeHint"></small>
              </div>
              <select id="set-theme">
                <option value="system" data-i18n="settings.themeSystem"></option>
                <option value="light" data-i18n="settings.themeLight"></option>
                <option value="dark" data-i18n="settings.themeDark"></option>
              </select>
            </div>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.closeAction"></b>
                <small data-i18n="settings.closeActionHint"></small>
              </div>
              <select id="set-close-action">
                <option value="exit" data-i18n="settings.closeExit"></option>
                <option value="tray" data-i18n="settings.closeTray"></option>
              </select>
            </div>
          </div>

          <div class="setting-block">
            <h4 data-i18n="settings.section.refresh"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.refreshInterval"></b>
                <small data-i18n="settings.refreshIntervalHint"></small>
              </div>
              <select id="set-refresh-interval">
                <option value="off" data-i18n="settings.refreshOff"></option>
                <option value="15" data-i18n="settings.refreshMin15"></option>
                <option value="30" data-i18n="settings.refreshMin30"></option>
                <option value="60" data-i18n="settings.refreshMin60"></option>
                <option value="120" data-i18n="settings.refreshMin120"></option>
                <option value="360" data-i18n="settings.refreshMin360"></option>
              </select>
            </div>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.refreshOnStart"></b>
                <small data-i18n="settings.refreshOnStartHint"></small>
              </div>
              <label class="switch"><input type="checkbox" id="set-refresh-on-start" /><span></span></label>
            </div>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.notifyNewArticles"></b>
                <small data-i18n="settings.notifyNewArticlesHint"></small>
              </div>
              <label class="switch"><input type="checkbox" id="set-notify-new-articles" /><span></span></label>
            </div>
          </div>

          <div class="setting-block">
            <h4 data-i18n="settings.section.storage"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.dbPath"></b>
                <small id="general-db-path"></small>
              </div>
            </div>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.storageHintTitle"></b>
                <small data-i18n="settings.storageHint"></small>
              </div>
            </div>
          </div>
        </div>

        <!-- 阅读 -->
        <div class="pane hidden" data-pane="reading">
          <h3 data-i18n="settings.nav.reading"></h3>

          <div class="setting-block">
            <h4 data-i18n="settings.section.readBehaviour"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.markRead.title"></b>
                <small data-i18n="settings.markRead.hint"></small>
              </div>
              <label class="switch"><input type="checkbox" id="set-mark-read" /><span></span></label>
            </div>
          </div>

          <div class="setting-block">
            <h4 data-i18n="settings.section.bulk"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.bulkTitle"></b>
                <small data-i18n="settings.bulkHint"></small>
              </div>
            </div>
            <div class="setting-actions">
              <button id="act-mark-all-read" data-i18n="settings.markAllRead"></button>
              <button id="act-mark-all-unread" data-i18n="settings.markAllUnread"></button>
            </div>
          </div>
        </div>

        <!-- 数据 -->
        <div class="pane hidden" data-pane="data">
          <h3 data-i18n="settings.nav.data"></h3>

          <div class="setting-block">
            <h4 data-i18n="settings.section.opml"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.opmlTitle"></b>
                <small data-i18n="settings.opmlHint"></small>
              </div>
            </div>
            <div class="setting-actions">
              <button id="act-import-opml" data-i18n="settings.importOpml"></button>
              <button id="act-export-opml" data-i18n="settings.exportOpml"></button>
            </div>
          </div>

          <div class="setting-block">
            <h4 data-i18n="settings.section.backup"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.backupTitle"></b>
                <small data-i18n="settings.backupHint"></small>
              </div>
            </div>
            <div class="setting-actions">
              <button id="act-backup-db" data-i18n="settings.backupDb"></button>
              <button id="act-restore-db" data-i18n="settings.restoreDb"></button>
            </div>
          </div>
        </div>

        <!-- AI -->
        <div class="pane hidden" data-pane="ai">
          <h3 data-i18n="settings.nav.ai"></h3>

          <div class="setting-block">
            <h4 data-i18n="settings.section.provider"></h4>

            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.ai.provider"></b>
              </div>
              <select id="ai-provider">
                <option value="ollama" data-i18n="settings.ai.providerOllama"></option>
                <option value="openai" data-i18n="settings.ai.providerOpenai"></option>
                <option value="anthropic" data-i18n="settings.ai.providerAnthropic"></option>
                <option value="gemini" data-i18n="settings.ai.providerGemini"></option>
              </select>
            </div>

            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.ai.model"></b>
                <small data-i18n="settings.ai.modelPlaceholder"></small>
              </div>
              <input id="ai-model" autocomplete="off" />
            </div>

            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.ai.baseUrl"></b>
                <small data-i18n="settings.ai.baseUrlPlaceholder"></small>
              </div>
              <input id="ai-base-url" autocomplete="off" />
            </div>

            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.ai.target"></b>
              </div>
              <input id="ai-target" autocomplete="off" />
            </div>
          </div>

          <div class="setting-block">
            <h4 data-i18n="settings.section.credentials"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.ai.key"></b>
                <small id="ai-key-hint" data-i18n="settings.ai.keyPlaceholder"></small>
              </div>
              <input id="ai-key" type="password" autocomplete="off" />
            </div>
            <div class="setting-actions">
              <button id="ai-save" data-i18n="settings.ai.save"></button>
              <button id="ai-clear-key" data-i18n="settings.ai.clearKey"></button>
              <button id="ai-test" data-i18n="settings.ai.test"></button>
            </div>
            <p id="ai-status" class="dim small">—</p>
          </div>

          <div class="setting-block">
            <h4 data-i18n="settings.section.sending"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.ai.confirmBeforeSend"></b>
                <small data-i18n="settings.ai.confirmBeforeSendHint"></small>
              </div>
              <label class="switch"><input type="checkbox" id="set-ai-confirm" /><span></span></label>
            </div>
          </div>
        </div>

        <!-- MCP -->
        <div class="pane hidden" data-pane="mcp">
          <h3 data-i18n="settings.nav.mcp"></h3>

          <div class="setting-block">
            <h4 data-i18n="settings.section.server"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.mcp.enabled"></b>
                <small data-i18n="settings.mcp.hint"></small>
              </div>
              <label class="switch"><input type="checkbox" id="set-mcp-enabled" /><span></span></label>
            </div>

            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.mcp.port"></b>
                <small data-i18n="settings.mcp.portHint"></small>
              </div>
              <input id="mcp-port" type="number" min="1024" max="65535" />
            </div>

            <p id="mcp-status" class="dim small">—</p>
          </div>

          <div class="setting-block">
            <h4 data-i18n="settings.section.client"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.mcp.snippetTitle"></b>
                <small data-i18n="settings.mcp.snippetHint"></small>
              </div>
            </div>
            <div class="setting-actions">
              <button id="mcp-copy-snippet" data-i18n="settings.mcp.copySnippet"></button>
              <button id="mcp-rotate" data-i18n="settings.mcp.rotate"></button>
            </div>
            <textarea id="mcp-snippet" rows="8" readonly></textarea>
          </div>
        </div>

        <!-- RSSHub -->
        <div class="pane hidden" data-pane="rsshub">
          <h3 data-i18n="settings.nav.rsshub"></h3>
          <div class="setting-block">
            <h4 data-i18n="settings.section.rsshubInstance"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.rsshub.mirror"></b>
                <small data-i18n="settings.rsshub.mirrorHint"></small>
              </div>
              <input id="set-rsshub-mirror" autocomplete="off" />
            </div>
            <div class="setting-actions">
              <button id="btn-rsshub-save" data-i18n="settings.rsshub.save"></button>
              <button id="btn-rsshub-test" data-i18n="settings.rsshub.test"></button>
            </div>
            <p id="rsshub-status" class="dim small">—</p>
          </div>
          <div class="setting-block">
            <h4 data-i18n="settings.section.migration"></h4>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.rsshub.migrate"></b>
                <small data-i18n="settings.rsshub.migrateHint"></small>
              </div>
              <button id="btn-rsshub-migrate" data-i18n="settings.rsshub.migrate"></button>
            </div>
          </div>
        </div>

        <!-- 关于 -->
        <div class="pane hidden" data-pane="about">
          <h3 data-i18n="settings.nav.about"></h3>
          <div class="setting-block">
            <div class="setting-item">
              <div class="text">
                <b>RustRss</b>
                <small data-i18n="settings.about.tagline"></small>
              </div>
            </div>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.about.license"></b>
                <small>MIT OR Apache-2.0</small>
              </div>
            </div>
            <div class="setting-item">
              <div class="text">
                <b data-i18n="settings.about.privacy"></b>
                <small data-i18n="settings.about.privacyHint"></small>
              </div>
            </div>
          </div>
        </div>
      </section>

      <button id="settings-close" class="settings-close" data-i18n-title="settings.close">✕</button>
    </div>
  </div>

  <div id="ai-confirm-overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="confirm-sheet">
      <h3 data-i18n="ai.confirm.title"></h3>
      <p id="ai-confirm-summary" class="dim small"></p>

      <div class="confirm-section">
        <h4 data-i18n="ai.confirm.target"></h4>
        <code id="ai-confirm-url"></code>
      </div>

      <div class="confirm-section">
        <h4 data-i18n="ai.confirm.headers"></h4>
        <pre id="ai-confirm-headers"></pre>
      </div>

      <div class="confirm-section grow">
        <h4><span data-i18n="ai.confirm.body"></span><span id="ai-confirm-meta" class="dim"></span></h4>
        <pre id="ai-confirm-body"></pre>
      </div>

      <p id="ai-confirm-note" class="dim small"></p>

      <div class="confirm-actions">
        <label class="confirm-skip">
          <input type="checkbox" id="ai-confirm-dont-ask" />
          <span data-i18n="ai.confirm.dontAsk"></span>
        </label>
        <span class="spacer"></span>
        <button id="ai-confirm-cancel" data-i18n="ai.confirm.cancel"></button>
        <button id="ai-confirm-send" class="primary" data-i18n="ai.confirm.send"></button>
      </div>
    </div>
  </div>

  <script src="vendor/highlight.min.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>

</html>
