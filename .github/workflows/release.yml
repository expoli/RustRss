# 正式发布：推 v* 标签 → 三平台安装包 + GitHub Release（自动生成变更说明）。
#
# 用法：先在根 Cargo.toml 的 [workspace.package] 与 src-tauri/tauri.conf.json
# bump 版本 → 提交 → `git tag vX.Y.Z && git push origin vX.Y.Z`。
# macOS 只在这里构建（私有仓库 macOS 计费 10 倍，不放 nightly）；
# dmg 未签名，首次打开需右键→打开 绕过 Gatekeeper。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb
            artifact: linux-deb
            glob: target/release/bundle/deb/*.deb
          - os: windows-latest
            bundles: nsis
            artifact: windows-nsis
            glob: target/release/bundle/nsis/*.exe
          - os: macos-latest   # arm64；如需 intel 加 macos-13 矩阵项
            bundles: dmg
            artifact: macos-dmg
            glob: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Build bundles
        run: npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "$TAG" dist/* \
            --title "RustRss $TAG" \
            --generate-notes \
            --notes "三平台安装包：Linux deb（ubuntu-22.04 基线）、Windows NSIS、macOS dmg（arm64，未签名，首次打开右键→打开）。" \
          || gh release upload "$TAG" dist/* --clobber
