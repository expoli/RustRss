# 正式发布：推 v* 标签 → 三平台安装包 + GitHub Release（自动生成变更说明）。
#
# 用法：先在根 Cargo.toml 的 [workspace.package] 与 src-tauri/tauri.conf.json
# bump 版本 → 提交 → `git tag vX.Y.Z && git push origin vX.Y.Z`。
# macOS 只在这里构建，避免每次开发构建都增加一个完整平台矩阵；
# dmg 未签名，首次打开需右键→打开 绕过 Gatekeeper。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate release tag version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch builds artifacts only; no release tag is required."
            exit 0
          fi

          tag_version="${RELEASE_TAG#v}"
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rustrss-desktop") | .version')"
          tauri_version="$(jq -r '.version' src-tauri/tauri.conf.json)"

          if [ "$tag_version" = "0.0.0" ]; then
            echo "Refusing to publish the placeholder version 0.0.0." >&2
            exit 1
          fi

          if [ "$tag_version" != "$cargo_version" ] || [ "$tag_version" != "$tauri_version" ]; then
            echo "Tag $RELEASE_TAG must match workspace version $cargo_version and Tauri version $tauri_version." >&2
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb
            artifact: linux-deb
            glob: target/release/bundle/deb/*.deb
          - os: windows-latest
            bundles: nsis
            artifact: windows-nsis
            glob: target/release/bundle/nsis/*.exe
          - os: macos-latest   # arm64；如需 intel 加 macos-13 矩阵项
            bundles: dmg
            artifact: macos-dmg
            glob: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Build bundles
        run: npx --yes @tauri-apps/cli@2.11.5 build --bundles ${{ matrix.bundles }}

      # 产物体积记录：写进 job summary（发布后把三平台数字回填 spec 的「安装包体积实测值」条目）。
      # 用 `wc -c` 而不是 `ls -l`/`du -b`：三个 runner 上都可用，且不吃 ls 的输出格式差异。
      # `workflow_dispatch` 只跑本 job（release job 限定 tag），所以量体积不必先打 tag。
      - name: Record bundle size
        shell: bash
        run: |
          {
            echo "### Bundle size: ${{ matrix.artifact }}"
            echo ''
            echo '```'
            for f in ${{ matrix.glob }}; do
              printf '%12s bytes  %s\n' "$(wc -c < "$f")" "$f"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: '*'
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "$TAG" dist/* \
            --title "RustRss $TAG" \
            --generate-notes \
            --notes "三平台安装包：Linux deb（Ubuntu 24.04 基线）、Windows NSIS、macOS dmg（arm64，未签名，首次打开右键→打开）。产物体积见同一次 run 的 build job summary，并回填 spec 的安装包体积条目。

          本产物按 AGPL-3.0-or-later 授权；需要闭源分发的商业授权见仓库 LICENSE-COMMERCIAL.md。
          对应源码：https://github.com/expoli/RustRss/tree/$TAG" \
          || gh release upload "$TAG" dist/* --clobber
