# 正式发布：推 v* 标签 → 三平台安装包 + Android 签名 APK + GitHub Release（自动生成变更说明）。
#
# 用法：先在根 Cargo.toml 的 [workspace.package] 与 src-tauri/tauri.conf.json
# bump 版本并提交 → 手动运行本 workflow 做四平台 preflight → 全绿后在同一 SHA 推 tag。
# macOS 只在这里构建，避免每次开发构建都增加一个完整平台矩阵；
# dmg 未签名，首次打开需右键→打开 绕过 Gatekeeper。
# Android 签名材料走 repo secrets（ANDROID_KEYSTORE_B64 / ANDROID_SIGNING_PROPS_B64，
# 见 docs/development.md 的 Android 段）：job 内还原为构建系统已接好约定的
# gen/android/{app/android-release.keystore, keystore.properties}，证书指纹
# 在构建后硬编码断言，防密钥被换。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate release tag version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check-version-consistency.py
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch builds artifacts only; no release tag is required."
            exit 0
          fi

          tag_version="${RELEASE_TAG#v}"
          if [ "$tag_version" = "0.0.0" ]; then
            echo "Refusing to publish the placeholder version 0.0.0." >&2
            exit 1
          fi
          python3 scripts/check-version-consistency.py --expected "$tag_version"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb
            artifact: linux-deb
            glob: target/release/bundle/deb/*.deb
          - os: windows-latest
            bundles: nsis
            artifact: windows-nsis
            glob: target/release/bundle/nsis/*.exe
          - os: macos-latest   # arm64；如需 intel 加 macos-13 矩阵项
            bundles: dmg
            artifact: macos-dmg
            glob: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Build bundles
        run: npx --yes @tauri-apps/cli@2.12.1 build --bundles ${{ matrix.bundles }}

      # 产物体积记录：写进 job summary（发布后把三平台数字回填 spec 的「安装包体积实测值」条目）。
      # 用 `wc -c` 而不是 `ls -l`/`du -b`：三个 runner 上都可用，且不吃 ls 的输出格式差异。
      # `workflow_dispatch` 只跑本 job（release job 限定 tag），所以量体积不必先打 tag。
      - name: Record bundle size
        shell: bash
        run: |
          {
            echo "### Bundle size: ${{ matrix.artifact }}"
            echo ''
            echo '```'
            for f in ${{ matrix.glob }}; do
              printf '%12s bytes  %s\n' "$(wc -c < "$f")" "$f"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  android:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018" > /dev/null

      - name: Install tauri-cli 2.12.1
        run: |
          cargo install tauri-cli --locked --version "=2.12.1"
          cargo tauri --version

      # 签名材料从 repo secrets 还原为构建系统已接好约定的两个文件
      # （gen/android/.gitignore 忽略它们，仓库内永远不含密钥本体）。
      - name: Restore release signing material
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          SIGNING_PROPS_B64: ${{ secrets.ANDROID_SIGNING_PROPS_B64 }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_B64" ] || [ -z "$SIGNING_PROPS_B64" ]; then
            echo "Missing secrets: ANDROID_KEYSTORE_B64 / ANDROID_SIGNING_PROPS_B64" >&2
            echo "Set them from the local signing files (base64 -w0)." >&2
            exit 1
          fi
          echo -n "$KEYSTORE_B64" | base64 -d > src-tauri/gen/android/app/android-release.keystore
          echo -n "$SIGNING_PROPS_B64" | base64 -d > src-tauri/gen/android/keystore.properties

      - name: Build Android APK (release, x86_64 + aarch64)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        # tauri v2 CLI 默认即 release（--debug 才是开关），没有 --release 旗子
        run: cargo tauri android build --target x86_64 --target aarch64 --apk

      - name: Verify APK version, signature and certificate fingerprint
        env:
          # 发布证书指纹是公开信息（APK 内自带）；硬编码在这里做防篡改断言：
          # CI 上若密钥被换，构建直接红。与 0.1.0 以来所有发布包同钥。
          EXPECTED_CERT_SHA256: 89269c116afaa9ca546f7287b268f00c14d5598b6c633715a74fbbcd28de8cc5
        run: |
          set -eu
          APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          python3 scripts/check-version-consistency.py --apk "$APK" --aapt "$BT/aapt"
          "$BT/apksigner" verify "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | grep -qi "$EXPECTED_CERT_SHA256"
          VERSION="$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          cp "$APK" "RustRss_${VERSION}_android-universal.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: RustRss_*_android-universal.apk
          if-no-files-found: error

  release:
    needs: [build, android]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: '*'
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "$TAG" dist/* \
            --title "RustRss $TAG" \
            --generate-notes \
            --notes "三平台安装包：Linux deb（Ubuntu 24.04 基线）、Windows NSIS、macOS dmg（arm64，未签名，首次打开右键→打开）。产物体积见同一次 run 的 build job summary，并回填 spec 的安装包体积条目。

          本产物按 AGPL-3.0-or-later 授权；需要闭源分发的商业授权见仓库 LICENSE-COMMERCIAL.md。
          对应源码：https://github.com/expoli/RustRss/tree/$TAG" \
          || gh release upload "$TAG" dist/* --clobber
