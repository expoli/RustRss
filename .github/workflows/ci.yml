# 基础 CI：每次 push(master) / PR 跑 Linux 测试/Clippy 与 Windows 编译；不生成安装包。
# 当前不检查 fmt；Clippy 对所有目标启用 warnings-as-errors。
name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check platform icon consistency
        run: python3 scripts/sync-icons.py --check

      - name: Check application version consistency
        run: python3 scripts/check-version-consistency.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Test
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Windows-only WebView2 code is not compiled by the Linux job. A library
      # check is enough to catch public dependency/type-identity drift without
      # paying the full NSIS packaging cost on every change.
      - name: Check Windows desktop library
        run: cargo check -p rustrss-desktop --lib --locked
