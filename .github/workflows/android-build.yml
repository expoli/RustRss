# Android 构建：在本地 release 签名链路建立后，为侧载 APK 提供持续构建检查。
# 做 x86_64 + aarch64 通用 debug APK（调试签名自动生成，不需要密钥）；发布签名仍由本地
# keystore.properties 完成（见 docs/development.md 的 Android 段）。
# 桌面 CI（ci.yml / release.yml）保持不变。
name: android-build

on:
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src-tauri/**"
      - "crates/**"
      - "ui/**"
      - "scripts/check-version-consistency.py"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src-tauri/**"
      - "crates/**"
      - "ui/**"
      - "scripts/check-version-consistency.py"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check platform icon consistency
        run: python3 scripts/sync-icons.py --check

      - name: Check application version consistency
        run: python3 scripts/check-version-consistency.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # 该 action 默认 packages 含已被 SDK Manager 移除的 "tools"，
          # 显式只装 platform-tools；NDK 由下一步显式安装，build-tools
          # 用 runner 镜像预装版本（apksigner 步骤按版本取最新）。
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018" > /dev/null

      # 与桌面发布工作流固定同一 CLI，避免平台构建工具漂移。
      - name: Install tauri-cli 2.12.1
        run: |
          cargo install tauri-cli --locked --version "=2.12.1"
          cargo tauri --version

      - name: Build Android APK (debug, x86_64 + aarch64)
        env:
          # sdkmanager 装的 NDK 在版本化目录 ndk/<ver>，不是旧的 ndk-bundle；
          # tauri CLI 会校验 NDK_HOME 指向真实 NDK（含 source.properties）。
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: cargo tauri android build --debug --target x86_64 --target aarch64 --apk

      - name: Verify APK version and signature
        run: |
          APK="src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          python3 scripts/check-version-consistency.py --apk "$APK" --aapt "$BT/aapt"
          "$BT/apksigner" verify "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: rustrss-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 14
