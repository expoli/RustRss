# 开发通道构建：仅手动触发 → 安装包挂到滚动 pre-release `nightly`。
# 只允许从 master 触发，避免其它分支覆盖当前开发版。
#
# 平台范围：Linux(deb) + Windows(NSIS)。macOS 仅在 v* 正式发布时构建 dmg，
# 避免每次开发构建都增加一个完整平台矩阵。
#
# 发布说明：nightly 每次整删整传，避免版本变化后残留旧资产；正式发布时
# workspace / tauri.conf.json 版本必须与 vX.Y.Z tag 一致，release 工作流会校验。
name: nightly

on:
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # workflow_dispatch 可选择任意 ref；只有 master 可以更新滚动 nightly。
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04  # Linux 最低支持版本
            bundles: deb
            artifact: linux-deb
            glob: target/release/bundle/deb/*.deb
          - os: windows-latest
            bundles: nsis
            artifact: windows-nsis
            glob: target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # 固定 CLI 版本，避免同一提交因 npx 解析到新版本而产生不同构建结果。
      - name: Build bundles
        run: npx --yes @tauri-apps/cli@2.11.5 build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: '*'
          merge-multiple: true
          path: dist

      - name: Publish rolling nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # 滚动标签：整删整传，避免版本变化后残留旧名资产
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/* \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Nightly (dev build)" \
            --notes "自动构建 · commit \`${{ github.sha }}\` · $(date -u '+%Y-%m-%d %H:%M UTC')

          包内容：Linux deb（Ubuntu 24.04 基线）+ Windows NSIS 安装器。
          首次安装：Linux 需要 libwebkit2gtk-4.1 / libgtk-3 / libayatana-appindicator3（deb 的 depends 已声明，apt 会自动带）。

          本产物按 AGPL-3.0-or-later 授权；需要闭源分发的商业授权见仓库 LICENSE-COMMERCIAL.md。
          对应源码：https://github.com/expoli/RustRss/tree/${{ github.sha }}"
