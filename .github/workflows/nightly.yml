# 开发通道构建：每次 push(master) / 手动触发 → 全平台安装包挂到滚动
# pre-release 标签 `nightly` 下（旧资源先删后传，始终对应当前 master）。
#
# 平台范围：Linux(deb) + Windows(NSIS)。macOS 故意不在 nightly（私有仓库
# Actions 计费 macOS 10 倍，日常推送会烧穿免费额度），release 走 v* 标签
# 时才构建 macOS dmg。
#
# 版本号说明：tauri.conf.json / workspace 版本当前为 0.0.0，deb/exe 资源名
# 稳定，nightly 每次整删整传不会残留陈旧资产；发正式版前记得先 bump 版本再打 tag。
name: nightly

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # 22.04 基线：deb 在 22.04/24.04 均可安装（glibc 兼容）
            bundles: deb
            artifact: linux-deb
            glob: target/release/bundle/deb/*.deb
          - os: windows-latest
            bundles: nsis
            artifact: windows-nsis
            glob: target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # 前端是 ../ui 静态文件、无 npm 构建链；tauri CLI 经 npx 取预编译二进制
      #（本地已验证 2.11.5 可用），bundle 目标按平台在命令行覆盖 tauri.conf 的 deb 默认
      - name: Build bundles
        run: npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: dist

      - name: Publish rolling nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # 滚动标签：整删整传，避免版本变化后残留旧名资产
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/* \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Nightly (dev build)" \
            --notes "自动构建 · commit \`${{ github.sha }}\` · $(date -u '+%Y-%m-%d %H:%M UTC')

          包内容：Linux deb（ubuntu-22.04 基线）+ Windows NSIS 安装器。
          首次安装：Linux 需要 libwebkit2gtk-4.1 / libgtk-3 / libayatana-appindicator3（deb 的 depends 已声明，apt 会自动带）。

          本产物按 AGPL-3.0-or-later 授权；需要闭源分发的商业授权见仓库 LICENSE-COMMERCIAL.md。
          对应源码：https://github.com/expoli/RustRss/tree/${{ github.sha }}"
