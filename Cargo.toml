[workspace]
members = ["src-tauri", "crates/rustrss-core", "crates/rustrss-mcp"]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/expoli/RustRss"

[workspace.dependencies]
# `with_webview` exposes platform backend types in Tauri's public API. Keep all
# targets on one Tauri minor line so those types cannot drift underneath us.
tauri = "~2.12.0"
