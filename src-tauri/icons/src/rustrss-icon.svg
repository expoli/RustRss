<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>RustRss</title>
  <!-- Filled-only geometry (no strokes) so every renderer, incl. ImageMagick MSVG, draws it identically. -->
