[package]
name = "rustrss-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rustrss-core = { path = "../crates/rustrss-core" }
rustrss-mcp = { path = "../crates/rustrss-mcp" }
# 日志门面：src-tauri 直接用宏（落点与 writer 在 rustrss-core::logging）。
log = { version = "0.4", features = ["std"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
# 系统通知（桌面端底层是 notify-rust：Linux 走 org.freedesktop.Notifications，
# 不额外依赖系统库）。锁 2.x：3.x 还在 alpha，且与 Tauri 2 不兼容。
tauri-plugin-notification = "2.4"
# 单实例锁（只在默认库下注册）。平台实现：Linux 是 D-Bus 名（`{identifier}.SingleInstance`）、
# macOS 是 unix socket、Windows 是命名 mutex + WM_COPYDATA。
tauri-plugin-single-instance = "2"
# API key 存操作系统凭据库：Linux 走 Secret Service（KWallet/GNOME Keyring），
# macOS 走 Keychain，Windows 走凭据管理器。
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `process`：字体枚举要跑 fc-list，且需要「超时即杀掉」的语义
# （std::process 没有带超时的等待，自己轮询 try_wait 会在子进程写满管道时死锁）。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }

[features]
default = []
snapshot-probe = ["dep:webkit2gtk", "dep:cairo-rs", "dep:gtk", "tokio/sync"]

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", optional = true }
cairo-rs = { version = "0.18", features = ["png"], optional = true }
gtk = { version = "0.18", optional = true }

[[example]]
name = "theme_snapshot"
path = "examples/theme_snapshot.rs"
required-features = ["snapshot-probe"]

[dev-dependencies]
# 测试用 mock app（空 feature）：验「没有托盘时 update_badge 静默 no-op」不必起真窗口。
tauri = { version = "2", features = ["test"] }
