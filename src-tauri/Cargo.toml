[package]
name = "rustrss-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

# 共享应用入口在 `src/lib.rs`（`run()`）：桌面启动器 `src/main.rs` 只是调用它，
# Android 侧由 `#[tauri::mobile_entry_point]` 加载同一份代码。
# `_lib` 后缀是为了让 lib 名与 bin 名不同（同名会在 Windows 上冲突，
# 见 https://github.com/rust-lang/cargo/issues/8519）。
[lib]
name = "rustrss_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
rustrss-core = { path = "../crates/rustrss-core" }
rustrss-mcp = { path = "../crates/rustrss-mcp" }
# 日志门面：src-tauri 直接用宏（落点与 writer 在 rustrss-core::logging）。
log = { version = "0.4", features = ["std"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
# 系统通知（桌面端底层是 notify-rust：Linux 走 org.freedesktop.Notifications，
# 不额外依赖系统库）。锁 2.x：3.x 还在 alpha，且与 Tauri 2 不兼容。
tauri-plugin-notification = "2.4"
# API key 存操作系统凭据库：Linux 走 Secret Service（KWallet/GNOME Keyring），
# macOS 走 Keychain，Windows 走凭据管理器。
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `process`：字体枚举要跑 fc-list，且需要「超时即杀掉」的语义
# （std::process 没有带超时的等待，自己轮询 try_wait 会在子进程写满管道时死锁）。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }

[features]
default = []
snapshot-probe = []

# 桌面端专属依赖（Android/iOS 不注册这两项服务）：
# - `tray-icon`：`tauri::tray` 只在 `all(desktop, feature = "tray-icon")` 下存在，
#   移动端没有托盘后端，所以特性也只挂在桌面目标上；
# - 单实例锁：`tauri-plugin-single-instance` 在移动端本身就是空 crate
#   （源码首行 `#![cfg(not(any(target_os = "android", target_os = "ios")))]`），
#   这里连依赖都不再编译。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2" }
cairo-rs = { version = "0.18", features = ["png"] }
gtk = { version = "0.18" }
png = "0.17"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
windows-core = "=0.61.2"
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSGraphicsContext", "NSImage", "NSImageRep", "NSView", "NSWindow", "objc2-core-graphics"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-foundation = "=0.3.2"
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKSnapshotConfiguration", "WKWebView", "block2", "objc2-app-kit", "objc2-core-foundation"] }
block2 = "=0.6.2"
png = "0.17"

[[example]]
name = "theme_snapshot"
path = "examples/theme_snapshot.rs"
required-features = ["snapshot-probe"]

[dev-dependencies]
# 测试用 mock app（空 feature）：验「没有托盘时 update_badge 静默 no-op」不必起真窗口。
tauri = { version = "2.12", features = ["test"] }

[[example]]
name = "theme_ui"
path = "examples/theme_ui.rs"
required-features = ["snapshot-probe"]
